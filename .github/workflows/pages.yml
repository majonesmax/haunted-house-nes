# The "play in your browser" page on GitHub Pages: site/index.html, with the latest release's ROMs beside it
# (so the page always plays exactly the released ROM). EmulatorJS and its FCEUmm core load from their own
# site. Runs after each release (build.yml calls it), or by hand: Actions -> "Pages" -> Run workflow.
name: Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The latest release's ROMs (with music, and ambient), beside the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir site \
            --pattern haunted_house.nes --pattern haunted_house_ambient.nes
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
