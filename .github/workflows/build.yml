# Builds the shareable ROM and checks it, on every push to main and every pull request; on a version tag
# (git tag v1.0.0 && git push origin v1.0.0) it also makes that release: the ROM, SHA256SUMS.txt and the
# notes in docs/release-notes/<tag>.md.
#
# None of it needs the 2600 game: the shareable build is our own mansion, art and rules (tools/shareable.py),
# and its check runs the remaster's model on that mansion beside the NES (tests/verify_engine.py --shareable).
# The faithful build needs your own ROM, so it's only ever built on your computer.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: haunted-house-nes
      - name: The remaster, beside it (its model, its NES look, its classic pack)
        uses: actions/checkout@v4
        with:
          repository: majonesmax/haunted-house-remastered
          path: haunted-house
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tools (cc65; PortAudio, which the remaster's check imports)
        run: sudo apt-get update && sudo apt-get install -y cc65 libportaudio2
      - name: Requirements
        working-directory: haunted-house-nes
        run: python -m pip install -r requirements-dev.txt
      - name: Readability rules (ruff)
        working-directory: haunted-house-nes
        run: ruff check --config ruff.toml .
      - name: Type hints (pyright)
        working-directory: haunted-house-nes
        run: pyright --pythonpath "$(which python)"
      - name: No file got harder to read (tools/readability.py)
        working-directory: haunted-house-nes
        run: python tools/readability.py
      - name: The mansion plays as the original does (tools/check_mansion.py)
        working-directory: haunted-house-nes
        run: python tools/check_mansion.py && python tests/test_check_mansion.py
      - name: Build the shareable ROM
        working-directory: haunted-house-nes
        run: python tools/build.py --shareable
      - name: The FCEUmm core, to play it in
        working-directory: haunted-house-nes
        run: python tools/get_core.py
      - name: It boots
        working-directory: haunted-house-nes
        run: python tests/test_boot.py --shareable
      - name: It plays exactly as the model says, frame by frame, never late
        working-directory: haunted-house-nes
        run: python tests/verify_engine.py --shareable 1500 0
      - name: Its hints say what the remaster's say
        working-directory: haunted-house-nes
        run: python tests/test_hints.py --shareable 200 0
      - name: The ROM, as this run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: haunted_house.nes
          path: haunted-house-nes/build/shareable/haunted_house.nes
      - name: The release (on a version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: haunted-house-nes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/shareable/haunted_house.nes haunted_house.nes
          sha256sum haunted_house.nes > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" haunted_house.nes SHA256SUMS.txt \
            --title "Haunted House for the NES $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
