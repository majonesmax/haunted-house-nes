# The cartridge's memory: an MMC3 board with 32K of program and 32K of tiles.
MEMORY {
  ZP:          start = $0000, size = $0080, type = rw;   # the NES's own bytes; the game's state is $80-$FF
  RAM:         start = $0300, size = $0500, type = rw;   # $0200 is the sprites' table
  HEADER:      start = $0000, size = $0010, file = %O, fill = yes;
  DATA_BANKS:  start = $8000, size = $4000, file = %O, fill = yes;   # banks 0-1, put at $8000 at power-on
  FIXED:       start = $C000, size = $4000, file = %O, fill = yes;   # banks 2-3, always there
  CHR:         start = $0000, size = $8000, file = %O, fill = yes;
}
SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  BSS:      load = RAM, type = bss;
  HEADER:   load = HEADER, type = ro;
  MAPS:     load = DATA_BANKS, type = ro;
  CODE:     load = FIXED, type = ro;
  RODATA:   load = FIXED, type = ro;
  VECTORS:  load = FIXED, type = ro, start = $FFFA;
  CHARS:    load = CHR, type = ro;
}
