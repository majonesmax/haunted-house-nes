# The cartridge's memory: an MMC3 board with 64K of program (eight 8K banks) and 32K of tiles.
#   bank 0  at $8000: the floors' maps          bank 1  at $A000: the music and effects
#   bank 2  at $8000 when wanted: the title, the story, the ending and the help (put back after)
#   banks 3-5: free                             banks 6-7 at $C000: the code, always there
MEMORY {
  ZP:          start = $0000, size = $0080, type = rw;   # the NES's own bytes; the game's state is $80-$FF
  RAM:         start = $0300, size = $0500, type = rw;   # $0200 is the sprites' table
  HEADER:      start = $0000, size = $0010, file = %O, fill = yes;
  BANK_0:      start = $8000, size = $2000, file = %O, fill = yes;
  BANK_1:      start = $A000, size = $2000, file = %O, fill = yes;
  BANK_2:      start = $8000, size = $2000, file = %O, fill = yes;
  BANK_3:      start = $8000, size = $2000, file = %O, fill = yes;
  BANK_4:      start = $8000, size = $2000, file = %O, fill = yes;
  BANK_5:      start = $8000, size = $2000, file = %O, fill = yes;
  FIXED:       start = $C000, size = $4000, file = %O, fill = yes;
  CHR:         start = $0000, size = $8000, file = %O, fill = yes;
}
SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  BSS:      load = RAM, type = bss;
  HEADER:   load = HEADER, type = ro;
  MAPS:     load = BANK_0, type = ro;
  MUSIC:    load = BANK_1, type = ro;
  EXTRAS:   load = BANK_2, type = ro, optional = yes;
  CODE:     load = FIXED, type = ro;
  RODATA:   load = FIXED, type = ro;
  VECTORS:  load = FIXED, type = ro, start = $FFFA;
  CHARS:    load = CHR, type = ro;
}
